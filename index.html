<!DOCTYPE html>
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Algoritmica UI — Studio de Arte Generativa</title>
  <!-- Biblioteca p5.js que ajuda a desenhar no computador -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: sans-serif; }
    body { display: flex; background: #0f111a; color: #fff; height: 100vh; overflow: hidden; }
    
    /* Painel lateral escuro (estilo software profissional) */
    #sidebar {
      width: 320px;
      background: #181b29;
      padding: 24px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      box-shadow: 4px 0 15px rgba(0,0,0,0.5);
      z-index: 10;
    }
    
    h1 { font-size: 1.1rem; color: #646cff; text-transform: uppercase; letter-spacing: 1px; }
    .control-group { display: flex; flex-direction: column; gap: 8px; }
    label { font-size: 0.85rem; color: #a0a5c0; }
    input[type=range] { width: 100%; cursor: pointer; }
    
    button {
      background: #646cff;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }
    button:hover { background: #535bf2; }
    
    /* Área principal da arte */
    #canvas-container {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #090a0f;
    }
  </style>
</head>
<body>

  <!-- PAINEL DE CONTROLE DE ENGENHARIA -->
  <div id="sidebar">
    <h1>Algoritmica UI</h1>
    <p style="font-size: 0.8rem; color: #777;">Studio de Arte Generativa SaaS</p>
    
    <hr style="border-color: #2a2e45;">

    <div class="control-group">
      <label for="particleCount">Quantidade de Linhas (Partículas):</label>
      <input type="range" id="particleCount" min="100" max="3000" value="800">
    </div>

    <div class="control-group">
      <label for="noiseScale">Ondulação / Vento (Noise Scale):</label>
      <input type="range" id="noiseScale" min="1" max="100" value="20">
    </div>

    <!-- AQUI ESTÁ A CAIXINHA DE PALETA DE CORES QUE ADICIONAMOS -->
    <div class="control-group">
      <label for="paletteSelect">Paleta de Cores:</label>
      <select id="paletteSelect" style="padding: 8px; border-radius: 4px; background: #222639; color: #fff; border: 1px solid #3f466b; cursor: pointer;">
        <option value="neon">Neon Cyberpunk</option>
        <option value="sunset">Sunset Vibes</option>
        <option value="matrix">Matrix Green</option>
      </select>
    </div>

    <button id="btnNewSeed">🎲 Gerar Nova Arte (Seed)</button>
    <button id="btnSave" style="background: #22c55e;">💾 Salvar Arte (PNG)</button>
  </div>

  <!-- A ÁREA ONDE A MÁGICA ACONTECE -->
  <div id="canvas-container"></div>

  <!-- Nosso script atualizado -->
  <script src="script.js"></script>
</body>
</html>
